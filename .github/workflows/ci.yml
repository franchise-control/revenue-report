name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 — нижняя заявленная граница в package.json, 22 — текущая LTS.
        # Обе проверяем на каждом изменении: расхождение между ними — это
        # обещание в engines, которое мы не сдержали.
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
